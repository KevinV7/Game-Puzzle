upstream web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Collected static files, shared read-only with the web container.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://web;
        # $http_host keeps the published port, which Django's CSRF origin check needs.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Set from the real scheme, never appended to a client-supplied value.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
